<!--
  Paste-ready EmailJS HTML template — einDateMitMir 💘

  HOW TO USE (EmailJS dashboard → Email Templates → your template):
    • Content tab → switch the editor to "Code" / HTML mode → paste the
      <body>…</body> markup below (everything between the two markers).
    • Settings tab:
        To Email  →  {{to_email}}
        Subject   →  {{subject}}
        From Name →  einDateMitMir 💘   (or your sender name)

  EmailJS HTML-escapes the variable VALUES, so we never inject prebuilt HTML —
  the layout lives here and we only fill these plain-text {{tokens}} (from
  lib/email.ts): {{header}} {{intro}} {{tag}} {{tageszeit}} {{stimmung}}
  {{aufregung}} {{aktivitaeten}} {{nachricht}} {{closing}} {{message}}

  Table-based + inline styles for broad email-client compatibility.
-->

<!-- ===== PASTE FROM HERE ===== -->
<div style="margin:0;padding:0;background-color:#fff5f8;">
  <!-- preheader (hidden) -->
  <div style="display:none;max-height:0;overflow:hidden;opacity:0;color:#fff5f8;font-size:1px;line-height:1px;">
    {{intro}}
  </div>

  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
         style="background-color:#fff5f8;background-image:linear-gradient(160deg,#ffe4ee 0%,#fff5f8 45%);">
    <tr>
      <td align="center" style="padding:32px 16px;">

        <!-- card -->
        <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0"
               style="width:100%;max-width:600px;background-color:#ffffff;border-radius:24px;
                      overflow:hidden;box-shadow:0 18px 40px rgba(193,42,100,0.18);
                      font-family:'Nunito','Segoe UI',Helvetica,Arial,sans-serif;">

          <!-- header band -->
          <tr>
            <td align="center"
                style="background-image:linear-gradient(135deg,#ff7aad 0%,#ff4f93 60%,#e63a7c 100%);
                       padding:36px 28px;">
              <div style="font-size:40px;line-height:1;margin-bottom:12px;">💌</div>
              <h1 style="margin:0;color:#ffffff;font-size:24px;line-height:1.25;font-weight:800;
                         font-family:'Quicksand','Nunito','Segoe UI',Helvetica,Arial,sans-serif;">
                {{header}}
              </h1>
              <p style="margin:10px 0 0;color:#ffe4ee;font-size:16px;line-height:1.4;font-weight:600;">
                {{intro}}
              </p>
            </td>
          </tr>

          <!-- details -->
          <tr>
            <td style="padding:28px 28px 8px;">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">

                <!-- Tag -->
                <tr>
                  <td style="padding:10px 0;border-bottom:1px solid #ffe4ee;">
                    <div style="color:#ff4f93;font-size:12px;font-weight:800;letter-spacing:0.06em;
                                text-transform:uppercase;">📅 Tag</div>
                    <div style="color:#c12a64;font-size:17px;font-weight:700;margin-top:4px;">{{tag}}</div>
                  </td>
                </tr>

                <!-- Tageszeit -->
                <tr>
                  <td style="padding:10px 0;border-bottom:1px solid #ffe4ee;">
                    <div style="color:#ff4f93;font-size:12px;font-weight:800;letter-spacing:0.06em;
                                text-transform:uppercase;">🕑 Tageszeit</div>
                    <div style="color:#c12a64;font-size:17px;font-weight:700;margin-top:4px;">{{tageszeit}}</div>
                  </td>
                </tr>

                <!-- Stimmung -->
                <tr>
                  <td style="padding:10px 0;border-bottom:1px solid #ffe4ee;">
                    <div style="color:#ff4f93;font-size:12px;font-weight:800;letter-spacing:0.06em;
                                text-transform:uppercase;">✨ Stimmung</div>
                    <div style="color:#c12a64;font-size:17px;font-weight:700;margin-top:4px;">{{stimmung}}</div>
                  </td>
                </tr>

                <!-- Aufregung -->
                <tr>
                  <td style="padding:10px 0;border-bottom:1px solid #ffe4ee;">
                    <div style="color:#ff4f93;font-size:12px;font-weight:800;letter-spacing:0.06em;
                                text-transform:uppercase;">💗 Aufregung</div>
                    <div style="font-size:20px;line-height:1.2;margin-top:4px;letter-spacing:2px;">{{aufregung}}</div>
                  </td>
                </tr>

                <!-- Aktivitäten -->
                <tr>
                  <td style="padding:10px 0;border-bottom:1px solid #ffe4ee;">
                    <div style="color:#ff4f93;font-size:12px;font-weight:800;letter-spacing:0.06em;
                                text-transform:uppercase;">🎈 Aktivitäten</div>
                    <div style="color:#c12a64;font-size:17px;font-weight:700;margin-top:4px;">{{aktivitaeten}}</div>
                  </td>
                </tr>

                <!-- Süße Nachricht -->
                <tr>
                  <td style="padding:10px 0;">
                    <div style="color:#ff4f93;font-size:12px;font-weight:800;letter-spacing:0.06em;
                                text-transform:uppercase;">💕 Süße Nachricht</div>
                    <div style="margin-top:8px;background-color:#fff5f8;border:1px solid #ffe4ee;
                                border-radius:14px;padding:14px 16px;color:#7a2547;font-size:16px;
                                line-height:1.5;font-style:italic;">
                      „{{nachricht}}“
                    </div>
                  </td>
                </tr>

              </table>
            </td>
          </tr>

          <!-- closing -->
          <tr>
            <td align="center" style="padding:18px 28px 32px;">
              <div style="background-image:linear-gradient(135deg,#fff5f8,#ffe4ee);border-radius:16px;
                          padding:18px 20px;color:#c12a64;font-size:16px;line-height:1.5;font-weight:700;">
                {{closing}}
              </div>
            </td>
          </tr>

          <!-- footer -->
          <tr>
            <td align="center" style="background-color:#fff5f8;padding:18px 28px;">
              <p style="margin:0;color:#ffa6c8;font-size:12px;line-height:1.4;">
                Gesendet mit 💘 von <strong style="color:#ff4f93;">einDateMitMir</strong>
              </p>
            </td>
          </tr>

        </table>
        <!-- /card -->

      </td>
    </tr>
  </table>
</div>
<!-- ===== PASTE TO HERE ===== -->
